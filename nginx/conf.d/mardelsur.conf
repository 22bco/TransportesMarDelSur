# ============================================================
#  transportesmardelsur.cl
#  Detrás de Cloudflare. SSL en el origen con Let's Encrypt.
#
#  TRANSICIÓN SSL:
#  - Mientras Cloudflare esté en modo "Flexible", se conecta al
#    origen por el puerto 80 -> el bloque :80 debe SERVIR el sitio
#    (no redirigir), si no se produce un bucle de redirección.
#  - Una vez que Cloudflare pase a "Full (strict)", se conectará
#    por :443 y recién entonces se puede activar el redirect en :80.
# ============================================================

# --- IP real del visitante vía Cloudflare ---
# Movido a conf.d/00-cloudflare-realip.conf: al declararlo en contexto http
# aplica a AMBOS server blocks (:80 y :443) y a los demás sitios del VPS.
# Antes estaba solo en :443, que es el puerto por el que el tráfico NO entra.

# --- Rate limiting para /admin/login (protección contra fuerza bruta) ---
# Va en contexto http; los archivos de conf.d se incluyen dentro del bloque http.
limit_req_zone $binary_remote_addr zone=mdslogin:10m rate=5r/m;

# HTTP (puerto 80)
server {
    listen 80;
    listen [::]:80;
    server_name transportesmardelsur.cl www.transportesmardelsur.cl;

    root /usr/share/nginx/html;
    access_log /var/log/nginx/mardelsur_access.log;
    error_log /var/log/nginx/mardelsur_error.log;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; object-src 'none'; base-uri 'self'" always;

    # Validación de certbot (emisión y renovación)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Archivos estáticos
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Login del panel: rate limiting contra fuerza bruta
    location = /admin/login {
        limit_req zone=mdslogin burst=3 nodelay;
        proxy_pass http://mardelsur_web:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # NOTA: cuando Cloudflare esté en "Full (strict)", reemplazar el
    # bloque "location /" de abajo por:
    #     location / { return 301 https://$host$request_uri; }
    location / {
        proxy_pass http://mardelsur_web:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# HTTPS (puerto 443)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name transportesmardelsur.cl www.transportesmardelsur.cl;

    ssl_certificate     /etc/letsencrypt/live/transportesmardelsur.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transportesmardelsur.cl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # IP real del visitante (Cloudflare)
    # IP real del visitante: ver conf.d/00-cloudflare-realip.conf (contexto http,
    # aplica a este y a todos los server blocks del proxy central).

    root /usr/share/nginx/html;
    access_log /var/log/nginx/mardelsur_access.log;
    error_log /var/log/nginx/mardelsur_error.log;

    # Cabeceras de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https:; object-src 'none'; base-uri 'self'" always;

    # Validación de certbot (renovación)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Archivos estáticos
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Login del panel: rate limiting contra fuerza bruta
    location = /admin/login {
        limit_req zone=mdslogin burst=3 nodelay;
        proxy_pass http://mardelsur_web:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Aplicación Flask
    location / {
        proxy_pass http://mardelsur_web:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
