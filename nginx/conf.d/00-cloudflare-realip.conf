# ============================================================
#  IP real del visitante detrás de Cloudflare — contexto http
#
#  Este archivo se carga en el bloque http{} (conf.d/*.conf se incluye ahí),
#  así que aplica a TODOS los server blocks del proxy central: los de este
#  proyecto y los de los demás sitios del VPS. Ver conf.d/README.md.
#
#  POR QUÉ EXISTE
#  Cloudflare está en modo "Flexible": se conecta al origen por el puerto 80.
#  Hasta 2026-08-05 los set_real_ip_from estaban SOLO en el server block :443,
#  o sea en el puerto por el que el tráfico real no entra. Consecuencia:
#  $remote_addr era la IP del edge de Cloudflare y no la del visitante, con lo
#  que todo limit_req por IP agrupaba a Cloudflare entera como un único
#  cliente. El rate limit de /admin/login existía pero no limitaba a nadie.
#
#  Al declararlo en contexto http el arreglo vale para cualquier puerto y para
#  cualquier sitio, y deja de haber dos listas de rangos que mantener.
#
#  Rangos oficiales: https://www.cloudflare.com/ips/
#  Revisar una vez al año; Cloudflare los cambia rara vez pero los cambia.
# ============================================================

