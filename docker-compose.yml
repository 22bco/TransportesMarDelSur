version: '3.8'

services:
  web:
    build: .
    container_name: mardelsur_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=app.py
      - TZ=America/Santiago
    env_file:
      - .env
    volumes:
      - ./static:/app/static:ro
      - ./templates:/app/templates:ro
      # Código: se montan DIRECTORIOS, no archivos sueltos. Añadir un módulo
      # nuevo no debe obligar a editar este archivo ni a recrear el contenedor.
      - ./app.py:/app/app.py:ro
      - ./admin.py:/app/admin.py:ro
      - ./db.py:/app/db.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./constancias:/app/constancias:ro
      - ./scripts:/app/scripts:ro
      # Único volumen de escritura: base de datos y adjuntos. static/ y
      # templates/ son :ro, así que nada de subidas puede vivir ahí.
      - ./docker-data/quotes:/app/data
    networks:
      - mardelsur_network
    # Sin swap en el host: si WeasyPrint se dispara, que el OOM killer mate a
    # este contenedor y no al servidor de correo o al backend de robótica.
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5001/').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: mardelsur_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - mardelsur_network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  certbot:
    image: certbot/certbot
    container_name: mardelsur_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mardelsur_mailserver
    hostname: mail.transportesmardelsur.cl
    restart: unless-stopped
    stop_grace_period: 1m
    env_file: mailserver.env
    ports:
      - "25:25"
      - "143:143"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
      - "110:110"
    volumes:
      - ./docker-data/dms/mail-data:/var/mail
      - ./docker-data/dms/mail-state:/var/mail-state
      - ./docker-data/dms/mail-logs:/var/log/mail
      - ./docker-data/dms/config:/tmp/docker-mailserver
      - ./certbot/conf:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - mardelsur_network
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: "ss --listening --tcp | grep -P 'LISTEN.+:smtp' || exit 1"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  roundcube:
    image: roundcube/roundcubemail:latest
    container_name: mardelsur_roundcube
    restart: unless-stopped
    environment:
      - ROUNDCUBEMAIL_DEFAULT_HOST=tls://mardelsur_mailserver
      - ROUNDCUBEMAIL_DEFAULT_PORT=143
      - ROUNDCUBEMAIL_SMTP_SERVER=tls://mardelsur_mailserver
      - ROUNDCUBEMAIL_SMTP_PORT=587
      - ROUNDCUBEMAIL_SKIN=elastic
      - ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE=25M
      - ROUNDCUBEMAIL_PLUGINS=archive,zipdownload,managesieve
    volumes:
      - roundcube_data:/var/roundcube/db
      - roundcube_html:/var/www/html
      - ./docker-data/roundcube-config/config.inc.php:/var/www/html/config/config.inc.php:ro
      - ./docker-data/roundcube-config/zzz-custom.php:/var/www/html/config/config.custom.inc.php:ro
    depends_on:
      - mailserver
    networks:
      - mardelsur_network

networks:
  mardelsur_network:
    driver: bridge

volumes:
  roundcube_data:
  roundcube_html:
